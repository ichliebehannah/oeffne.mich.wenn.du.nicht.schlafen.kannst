<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Öffne mich, wenn du an mich denkst ❤️</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f7f7f7;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 16px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Öffne mich, wenn du an mich denkst ❤️</h1>

    <p>Video</p>

    <div class="video-container">
      <iframe
        src="https://www.youtube-nocookie.com/embed/wWyF8zK-U9M"
        title="Öffne mich, wenn du an mich denkst"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</body>
</html>
